name: Compile PDFs

on:
  push:
    branches: [main]
    paths:
      - 'paper/main.tex'
      - 'paper/appendix.tex'
      - 'paper/references.bib'
      - 'paper/*.tex'
      - 'figures/**'
      - 'tables/**'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compile main paper
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          latexmk_use_xelatex: false
          latexmk_shell_escape: false

      - name: Compile appendix
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: appendix.tex
          latexmk_use_xelatex: false
          latexmk_shell_escape: false

      - name: Commit compiled PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf paper/appendix.pdf
          git diff --cached --quiet || git commit -m "docs: auto-compile PDFs from source [skip ci]"
          git push
